<!doctype html>
<html lang="en-AU">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeatInflation · compare every money product</title>
<meta name="description" content="Loans, banking, insurance, utilities and investing, compared by what they cost you. One account, Inflation Points that keep their value.">
<script>
  try { const t = localStorage.getItem("rb.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}
  // The home loan board moved to home-loans.html. Older links to the site root that carry board filters, the
  // create-account hash or a password-reset link still open the board.
  (function(){
    const q = new URLSearchParams(location.search), h = location.hash;
    const boardView = ["purpose", "repay", "lvr", "show", "sort", "product"].some(k => q.has(k));
    if (boardView || h === "#register" || h === "#join" || /type=(recovery|signup|invite)/.test(h))
      location.replace("home-loans.html" + location.search + h);
  })();
</script>
<link rel="stylesheet" href="common.css?v=6">
<link rel="stylesheet" href="app.css?v=9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<script src="app.js?v=7"></script>

<nav class="site-nav" id="siteNav" aria-label="Main"></nav>
<div class="wrap">
  <div class="visually-hidden" id="srStatus" role="status" aria-live="polite"></div>

  <main id="main" tabindex="-1">
    <h1 class="visually-hidden">All products</h1>
    <section class="card" id="myCard" hidden></section>
    <div class="hub" id="hub"></div>
  </main>

  <footer>
    <span>BeatInflation · Boring by design · general information, not advice.</span>
    <nav aria-label="Site">
      <a href="agent.html">For mortgage agents</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="accessibility.html">Accessibility</a>
    </nav>
  </footer>
</div>

<script>
  $("hub").innerHTML = SECTIONS.map(s => `
    <section aria-labelledby="h-${s.key}">
      <h2 id="h-${s.key}">${escapeHtml(s.title)}</h2>
      <ul>${s.items.map(k => {
        const c = CATEGORIES[k];
        return `<li><a href="${c.href || `compare.html?c=${k}`}">${escapeHtml(c.title)}</a></li>`;
      }).join("")}</ul>
    </section>`).join("");

  window.onSession = async (session) => {
    const card = $("myCard");
    // Signing in and creating an account live in the My account menu; the card only welcomes a signed-in customer.
    if (!session){
      card.hidden = true;
      card.textContent = "";
      return;
    }
    const [{ data: pts }, { count }] = await Promise.all([
      sb.rpc("points_summary"),
      sb.from("assets").select("id", { count: "exact", head: true }),
    ]);
    const p = pts && pts[0];
    card.hidden = false;
    card.innerHTML = `<div class="points-hero"><div><h2>Welcome back</h2>
        <p class="muted">${count ? `${count} asset${count === 1 ? "" : "s"} in your profile.` : "Your profile is empty. Add your first asset to start finding savings."}</p></div>
      <div><div class="points-big">${(p ? p.balance : 0).toLocaleString()}</div><span class="small muted">Inflation Points · ${money(p ? p.dollar_value : 0, 2)}</span></div></div>
      <div class="row-actions"><a class="btn-primary" href="my-money.html">Open My money</a></div>`;
  };
</script>
